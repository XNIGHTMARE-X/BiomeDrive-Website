<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template preview · BiomeDrive Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f2ee">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://picsum.photos">
<link rel="preconnect" href="https://fastly.picsum.photos">
<link rel="stylesheet" href="/studio/kit/kit.css?v=20">
<link rel="stylesheet" href="/studio/kit/fx.css?v=20">
<link rel="stylesheet" href="/studio/kit/motion.css?v=20">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<div id="page"></div>
<script src="/js/vendor/lenis.min.js"></script>
<script src="/js/vendor/motion.js"></script>
<script type="module">
  import { TEMPLATES } from '/studio/data/templates.js?v=20';
  import { render, dress, animate, findPalette, findFont, applyPalette, applyFont } from '/studio/kit/kit.js?v=20';
  import { prepare, run } from '/studio/kit/fx.js?v=20';

  const q = new URLSearchParams(location.search);
  const t = TEMPLATES.find(x => x.id === q.get('t')) || TEMPLATES[0];
  const shot = q.has('shot');
  dress(t, { palette: q.get('p'), font: q.get('f') });
  document.getElementById('page').innerHTML = render(t, { shot });
  const fx = prepare(t, { shot });               // interactive templates: preloader, cursor, split letters…
  const api = animate({ shot, gate: fx.gate });  // reveals wait for the preloader
  run(t, { shot }, fx);

  // the Studio talks to this page: new palette or type, without reloading
  const swap = fn => (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) ? document.startViewTransition(fn) : fn();
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
    const d = e.data;
    if (d.type === 'palette') { const p = d.palette && typeof d.palette === 'object' ? d.palette : findPalette(d.id); if (p) swap(() => applyPalette(p)); }
    if (d.type === 'font') { const f = findFont(d.id); if (f) { swap(() => applyFont(f)); setTimeout(api.fit, 400); document.fonts && document.fonts.ready.then(api.fit); } }
  });
  if (parent !== window) parent.postMessage({ type: 'ready', id: t.id }, location.origin);
  window.__ready = true;
</script>
</body>
</html>
